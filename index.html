let tasks=INITIAL_TASKS, tab="today", query="";
const tabs={today:"דחוף",new:"חדשה",old:"נוכחית",shopping:"קניות",done:"בוצע"};
const nextStatus={"לא התחיל":"בטיפול","בטיפול":"בוצע","בוצע":"לא התחיל"};
const app=initializeApp(firebaseConfig), db=getFirestore(app), boardRef=doc(db,"boards","main-moving-board");
const list=document.getElementById("list"), subtitle=document.getElementById("subtitle"), syncEl=document.getElementById("sync"), fill=document.getElementById("fill"), pct=document.getElementById("pct"), count=document.getElementById("count"), pageTitle=document.getElementById("pageTitle"), search=document.getElementById("search"), clear=document.getElementById("clear");
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function badgeClass(s){return s==="בוצע"?"b3":s==="בטיפול"?"b2":"b1"}
function visible(){return tasks.filter(t=>{const byTab=tab==="today"?t.priority==="גבוה"&&t.status!=="בוצע":tab==="done"?t.status==="בוצע":t.area===tab&&t.status!=="בוצע";const bySearch=!query||(t.task+" "+t.category+" "+t.timing).includes(query);return byTab&&bySearch})}
function stats(){const done=tasks.filter(t=>t.status==="בוצע").length,total=tasks.length||1,percent=Math.round(done/total*100);subtitle.textContent=`יכין 4 ➜ הרא״ה 92 · ${done}/${tasks.length} בוצעו`;fill.style.width=percent+"%";pct.textContent=percent+"%"}
function render(){stats();pageTitle.textContent=tabs[tab];document.querySelectorAll(".navBtn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const items=visible();count.textContent=`${items.length} משימות מוצגות`;clear.style.display=query?"inline-block":"none";if(!items.length){list.innerHTML='<div class="empty">אין פה משימות כרגע 🎉</div>';return}const groups={};items.forEach(t=>{groups[t.category]=groups[t.category]||[];groups[t.category].push(t)});list.innerHTML=Object.entries(groups).map(([cat,arr])=>`<section><h3 class="category">${esc(cat)}</h3><div class="cards">${arr.map(t=>`<article class="card ${t.status==="בוצע"?"done":""}"><div class="cardMain"><div class="row"><button class="dot ${t.status==="בוצע"?"done":t.status==="בטיפול"?"progress":""}" data-action="status" data-id="${t.id}">${t.status==="בוצע"?"✓":t.status==="בטיפול"?"•":""}</button><button class="taskBtn" data-action="status" data-id="${t.id}"><p class="taskText ${t.status==="בוצע"?"done":""}">${esc(t.task)}</p><div class="badges"><span class="badge ${badgeClass(t.status)}">${esc(t.status)}</span><span class="badge time">${esc(t.timing)}</span>${t.priority==="גבוה"?'<span class="badge urgent">דחוף</span>':t.priority==="בינוני"?'<span class="badge normal">בינוני</span>':t.priority==="נמוך"?'<span class="badge low">נמוך</span>':""}</div></button></div><div class="noteActions"><button class="noteBtn" data-action="toggleNotes" data-id="${t.id}">${t.noteOpen?"סגור ניהול":"ניהול / הערות"}</button><button class="deleteBtn" data-action="delete" data-id="${t.id}">מחק</button></div></div><div class="notes ${t.noteOpen?"open":""}"><div class="manage"><label>דחיפות<select data-action="priority" data-id="${t.id}"><option value="" ${!t.priority?"selected":""}>ללא דחיפות</option><option value="גבוה" ${t.priority==="גבוה"?"selected":""}>גבוה / דחוף</option><option value="בינוני" ${t.priority==="בינוני"?"selected":""}>בינוני</option><option value="נמוך" ${t.priority==="נמוך"?"selected":""}>נמוך</option></select></label><label>קטגוריה<input data-action="category" data-id="${t.id}" value="${esc(t.category)}" placeholder="קטגוריה"></label></div><input data-action="owner" data-id="${t.id}" value="${esc(t.owner)}" placeholder="אחריות"><input data-action="notes" data-id="${t.id}" value="${esc(t.notes)}" placeholder="הערה קצרה"></div></article>`).join("")}</div></section>`).join("")}
async function save(){syncEl.textContent="שומר...";localStorage.setItem("moving-house-backup",JSON.stringify(tasks));render();try{await setDoc(boardRef,{tasks,updatedAt:serverTimestamp()});syncEl.textContent="מסונכרן"}catch(e){console.error(e);syncEl.textContent="שגיאת שמירה — נשמר מקומית"}}
list.addEventListener("click",e=>{
const el=e.target.closest("[data-action]");
if(!el)return;
const action=el.dataset.action;
if(!["status","toggleNotes","delete"].includes(action))return;
const id=Number(el.dataset.id);
const t=tasks.find(x=>x.id===id);
if(!t)return;
if(action==="status")t.status=nextStatus[t.status];
if(action==="toggleNotes")t.noteOpen=!t.noteOpen;
if(action==="delete"){
  if(!confirm("למחוק את המשימה?"))return;
  tasks=tasks.filter(x=>x.id!==id);
}
save()
});
list.addEventListener("input",e=>{
const el=e.target.closest("[data-action]");
if(!el)return;
const t=tasks.find(x=>x.id===Number(el.dataset.id));
if(!t)return;
if(el.dataset.action==="owner")t.owner=el.value;
if(el.dataset.action==="notes")t.notes=el.value;
if(el.dataset.action==="category")t.category=el.value||"כללי";
clearTimeout(window._timer);
window._timer=setTimeout(save,600)
});
document.querySelectorAll(".navBtn").forEach(btn=>btn.addEventListener("click",()=>{tab=btn.dataset.tab;render()}));
document.getElementById("searchToggle").addEventListener("click",()=>{search.style.display=search.style.display==="block"?"none":"block";if(search.style.display==="block")search.focus()});
search.addEventListener("input",()=>{query=search.value.trim();render()});clear.addEventListener("click",()=>{query="";search.value="";render()});

list.addEventListener("change",e=>{
const el=e.target.closest("[data-action]");
if(!el)return;
const t=tasks.find(x=>x.id===Number(el.dataset.id));
if(!t)return;
if(el.dataset.action==="priority")t.priority=el.value;
if(el.dataset.action==="category")t.category=el.value||"כללי";
save()
});

const addPanel=document.getElementById("addPanel");
document.getElementById("addFab").addEventListener("click",()=>addPanel.classList.add("open"));
document.getElementById("closePanel").addEventListener("click",()=>addPanel.classList.remove("open"));
addPanel.addEventListener("click",e=>{if(e.target===addPanel)addPanel.classList.remove("open")});

document.getElementById("createTask").addEventListener("click",()=>{
const text=document.getElementById("newTaskText").value.trim();
if(!text)return;
const area=document.getElementById("newTaskArea").value;
const priority=document.getElementById("newTaskPriority").value;
const category=document.getElementById("newTaskCategory").value.trim()||"כללי";
const timing=document.getElementById("newTaskTiming").value.trim();
const task={
  id:Date.now(),
  area,
  category,
  task:text,
  priority,
  timing,
  status:"לא התחיל",
  owner:"",
  notes:"",
  noteOpen:false
};
tasks=[task,...tasks];
document.getElementById("newTaskText").value="";
document.getElementById("newTaskCategory").value="כללי";
document.getElementById("newTaskTiming").value="";
document.getElementById("newTaskPriority").value="";
addPanel.classList.remove("open");
save()
});

async function init(){try{const snap=await getDoc(boardRef);if(!snap.exists())await setDoc(boardRef,{tasks:INITIAL_TASKS,updatedAt:serverTimestamp()});onSnapshot(boardRef,d=>{const data=d.data();if(data&&Array.isArray(data.tasks)){tasks=data.tasks;syncEl.textContent="מסונכרן";localStorage.setItem("moving-house-backup",JSON.stringify(tasks));render()}},err=>{console.error(err);syncEl.textContent="שגיאת סנכרון — מצב מקומי";const saved=localStorage.getItem("moving-house-backup");if(saved)tasks=JSON.parse(saved);render()})}catch(e){console.error(e);syncEl.textContent="שגיאת חיבור — מצב מקומי";const saved=localStorage.getItem("moving-house-backup");if(saved)tasks=JSON.parse(saved);render()}}
render();init();
</script></body></html>
